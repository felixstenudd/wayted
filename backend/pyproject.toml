[project]
name = "wayted-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "pyjwt",
  "pwdlib[argon2]",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
# app/ has no __init__.py; without this mypy sees each module under two names.
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["db: needs a PostGIS database; set WAYTED_TEST_DATABASE_URL"]
