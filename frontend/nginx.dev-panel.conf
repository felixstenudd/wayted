server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The graph of one map view can be more than 10 MB of JSON, and MapLibre is 1 MB of script.
    gzip on;
    gzip_types application/json application/javascript text/css;

    # The trailing slash on proxy_pass strips the /api prefix before it reaches the dev API.
    location /api/ {
        proxy_pass http://dev-api:8000/;
        proxy_set_header Host $host;
    }

    # Vite fingerprints built assets, so they can be cached forever.
    location /assets/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
